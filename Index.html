<!DOCTYPE html>
<html lang="vi">

  <style>
    :root {
      --bg-page: #f8fafc;
      --bg-card: #ffffff;
      --bg-soft: #f1f5f9;
      --text-main: #0f172a;
      --text-muted: #475569;

      --highlight-bg: #dbeafe;
      --highlight-ring: #3b82f6;

    }
    .dark {
      --bg-page: #0f172a;
      --bg-card: #1e293b;
      --bg-soft: #334155;
      --text-main: #f8fafc;
      --text-muted: #cbd5e1;
      --border-col: #334155;
      --highlight-bg: #1e3a8a;
      --highlight-ring: #60a5fa;
      --highlight-text: #eff6ff;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      transition: background-color 0.2s, color 0.2s;
    }

      background-color: var(--bg-card);
      border: 1px solid var(--border-col);
    }
    .soft-box {
      background-color: var(--bg-soft);
    }
    .sentence-item {
      transition: background-color 0.2s, transform 0.15s, filter 0.2s;
      cursor: pointer;
    }
    .sentence-item:hover {
      background-color: var(--bg-soft);
    }
    .sentence-active {
      background-color: var(--highlight-bg) !important;
      color: var(--highlight-text) !important;
      box-shadow: inset 3px 0 0 var(--highlight-ring);
      font-weight: 500;
    }
    .sentence-blurred:not(.sentence-active) {
      filter: blur(4px);
      user-select: none;
    }
    .sentence-blurred:hover {
      filter: blur(0px);
    }
    .toast-enter {
      animation: slideUp 0.25s ease-out;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }

  </style>
</head>
<body class="min-h-screen pb-32">

            <option value="">Đang tải giọng đọc...</option>

        <!-- Speed -->

      <!-- Quick Toggles -->

  <!-- Sticky Bottom Audio Player -->
  <footer class="fixed bottom-0 inset-x-0 z-40 card border-x-0 border-b-0 shadow-lg">

      <!-- Player Controls -->

        <div class="flex items-center gap-1.5">
          <button id="btnSpeedQuick" type="button" class="px-2.5 py-1.5 rounded-lg text-xs font-bold soft-box hover:opacity-80 transition tabular-nums" title="Đổi nhanh tốc độ đọc">1.0x</button>
        </div>

        <div class="flex items-center gap-2 sm:gap-3">

  <script>
    const SAMPLE_LESSON = `Tóm tắt trọng tâm Bài 6 và Bài 7: Linh kiện điện tử.

Phần 1. Bài 6: Khảo sát các linh kiện thụ động.

1. Điện trở.
Cấu tạo và ký hiệu: Làm bằng gốm, bột hoặc kim loại. Điện trở thường ký hiệu là R, biến trở ký hiệu là R hoặc VR.
Đơn vị đo là Ôm. Quy đổi: 1 kilô ôm bằng 1000 ôm, 1 mêga ôm bằng 1000 kilô ôm, 1 mili ôm bằng 1 phần 1000 ôm.
Cách đọc điện trở 4 vòng màu: R bằng hai chữ số đầu nhân 10 mũ vòng thứ ba, đơn vị ôm, vòng cuối là nhũ vàng hoặc nhũ bạc.
Mẹo nhớ nhanh vòng thứ ba: Đen là chục ôm, Nâu là trăm ôm, Đỏ là kilô ôm, Cam là chục kilô ôm, Vàng là trăm kilô ôm, Xanh lá là mêga ôm, Nhũ vàng là ôm, Nhũ bạc là 0 phẩy ôm.
Cách đọc điện trở 5 vòng màu: R bằng ba chữ số đầu nhân 10 mũ vòng thứ tư, đơn vị ôm, vòng cuối cách xa hơn các vòng còn lại.
Cách mắc mạch: Mắc nối tiếp thì điện trở tương đương bằng tổng R1 cộng R2 cộng R3. Mắc song song hai điện trở thì bằng tích chia tổng, tức R1 nhân R2 chia cho R1 cộng R2.
Kiểm tra chất lượng bằng VOM: Giá trị đo được xấp xỉ giá trị ghi trên thân thì điện trở còn tốt.

2. Tụ điện.
Phân loại và ký hiệu: Gồm tụ không cực tính và tụ có cực tính, đều ký hiệu là C.
Đơn vị đo là Fara, các bậc liền kề cách nhau 1000 lần: 1 Fara bằng 1000 mili Fara, 1 mili Fara bằng 1000 micrô Fara, 1 micrô Fara bằng 1000 nanô Fara, 1 nanô Fara bằng 1000 picô Fara.
Cách đọc giá trị: Tụ có cực tính đọc trực tiếp trên thân, ví dụ 100 micrô Fara 25 Vôn là 100 micrô Fara. Tụ không cực tính ghi ba chữ số a b c thì C bằng a b nhân 10 mũ c, đơn vị picô Fara, ví dụ 104 bằng 0,1 micrô Fara.
Mẹo đọc nhanh tụ không cực: Đuôi 3 là 0 phẩy 0 micrô Fara, đuôi 4 là 0 phẩy micrô Fara, đuôi 5 là micrô Fara, đuôi 6 là chục micrô Fara.
Cách mắc mạch: Ngược với điện trở. Mắc nối tiếp hai tụ thì bằng tích chia tổng. Mắc song song thì bằng tổng C1 cộng C2.
Kiểm tra chất lượng bằng VOM: Bật VOM thang đo điện dung, đặt hai que vào hai chân tụ, giá trị đo xấp xỉ trị số trên thân thì tụ tốt.

3. Cuộn cảm.
Ký hiệu là L. Đơn vị đo là Henry, các bậc liền kề cách nhau 1000 lần: Henry, mili Henry, micrô Henry, nanô Henry, picô Henry.

Phần 2. Bài 7: Khảo sát các linh kiện tích cực.

1. Diode.
Chức năng: Là linh kiện bán dẫn có hai chân Anốt và Ca-tốt, dùng để chuyển đổi dòng điện xoay chiều thành dòng điện một chiều.
Nguyên lý làm việc: Nếu cực A có điện áp cao hơn cực K thì diode dẫn điện theo chiều từ A sang K, ngược lại diode không dẫn điện.
Kiểm tra chất lượng bằng VOM: Bật VOM thang đo điốt. Đặt que đỏ vào chân A, que đen vào chân K hiện từ 0,5 đến 0,7 Vôn; đảo ngược que hiện OL thì diode tốt.
Diode đặc biệt gồm LED là diode phát sáng, chân dài là A, chân ngắn hoặc cạnh vát phẳng là K; và Zener là diode ổn áp.
Ứng dụng: Dùng trong mạch chỉnh lưu nửa chu kỳ gồm 1 diode và mạch chỉnh lưu cầu gồm 4 diode.
